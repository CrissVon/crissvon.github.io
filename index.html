<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121212">
  <title>Розклад групи</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/favicon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Тему виставляємо до малювання сторінки, щоб не було спалаху
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = 'dark';
      document.documentElement.setAttribute('data-theme', t);
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', t === 'light' ? '#e9e9e9' : '#121212');
    })();
  </script>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <span class="topbar__title" id="groupName">Розклад</span>
      <div class="settings" id="settings">
        <button class="settings-btn" id="settingsBtn" type="button" aria-label="Налаштування" aria-haspopup="true" aria-expanded="false" aria-controls="settingsMenu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h9M17 18h3"/>
            <circle cx="15" cy="6" r="2"/>
            <circle cx="9" cy="12" r="2"/>
            <circle cx="15" cy="18" r="2"/>
          </svg>
        </button>

        <div class="settings-menu" id="settingsMenu" role="dialog" aria-label="Налаштування" hidden>
          <div class="set-row">
            <span class="set-row__label">Змінити тему</span>
            <span class="theme-toggle" id="themeToggle">
              <span class="theme-toggle__cap cap--dark">Темна</span>
              <button class="switch" id="themeSwitch" type="button" role="switch" aria-checked="false" aria-label="Світла тема">
                <span class="switch__knob">
                  <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
                  </svg>
                  <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
                  </svg>
                </span>
              </button>
              <span class="theme-toggle__cap cap--light">Світла</span>
            </span>
          </div>
          <div class="set-sounds" id="soundRows"></div>
        </div>
      </div>
    </header>

    <!-- Блок 1: дашборд реального часу -->
    <section class="hero" id="hero" aria-live="polite">
      <div class="hero__top">
        <span class="hero__label" id="heroLabel">Завантаження…</span>
        <span class="hero__right">
          <span class="hero__alert" id="heroAlert" hidden></span>
          <span class="hero__clock" id="heroClock"></span>
        </span>
      </div>
      <h1 class="hero__subject" id="heroSubject"></h1>
      <p class="hero__meta" id="heroMeta"></p>
      <div class="hero__teachers" id="heroTeachers"></div>
      <div class="hero__timer" id="heroTimer"></div>
      <div class="progress" id="heroProgress" hidden>
        <div class="progress__bar" id="heroProgressBar"></div>
      </div>
      <a class="join" id="joinBtn" href="#" target="_blank" rel="noopener" hidden>Підключитися</a>
    </section>

    <!-- Блок 2: навігація та розклад -->
    <section class="schedule">
      <div class="schedule__bar">
        <div class="weeks" role="tablist" aria-label="Тиждень">
          <button class="weeks__btn" data-week="1" role="tab">I тиждень</button>
          <button class="weeks__btn" data-week="2" role="tab">II тиждень</button>
        </div>
        <button class="today-btn" id="todayBtn" type="button" disabled>Сьогодні</button>
      </div>

      <nav class="days" id="days" role="tablist" aria-label="Дні тижня"></nav>

      <div class="day-note" id="dayNote" hidden></div>
      <div class="lessons" id="lessons"></div>

      <p class="notice" role="note">
        <strong>Посилання на заняття можуть оновлюватися викладачами.</strong>
        Якщо вони не працюють - заходьте на пару звичним способом.
        <strong>Розробник не несе відповідальність за пропущені пари :-)</strong>
      </p>
    </section>

    <footer class="foot" id="foot"></footer>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
